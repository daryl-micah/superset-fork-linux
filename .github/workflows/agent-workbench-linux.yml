name: Agent Workbench Linux

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "agent-workbench-v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts

      - name: Test packaging configuration
        run: bun test apps/desktop/electron-builder.test.ts

      - name: Type-check desktop
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: bun turbo typecheck --filter=@superset/desktop

  package:
    name: Package Ubuntu/Debian x64
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxkbfile-dev

      - name: Rebuild Electron native modules
        working-directory: apps/desktop
        run: bun run install:deps

      - name: Compile desktop
        working-directory: apps/desktop
        env:
          AGENT_WORKBENCH_LOCAL_MODE: "1"
          NODE_OPTIONS: --max-old-space-size=8192
          SKIP_ENV_VALIDATION: "1"
          TARGET_ARCH: x64
        run: |
          bun run generate:icons
          bun run compile:app

      - name: Package Linux artifacts
        working-directory: apps/desktop
        env:
          TARGET_ARCH: x64
        run: bun run package -- --publish never

      - name: Verify artifacts
        working-directory: apps/desktop
        run: |
          test -n "$(find release -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find release -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find release -maxdepth 1 -name '*-linux.yml' -print -quit)"
          deb_path="$(find release -maxdepth 1 -name '*.deb' -print -quit)"
          test "$(dpkg-deb --field "$deb_path" License)" = "Elastic-2.0"
          dpkg-deb --contents "$deb_path" >/dev/null
          test "$(stat -c '%a' release/linux-unpacked/chrome-sandbox)" = "4755"
          test -f release/linux-unpacked/resources/LICENSE.md
          test -f release/linux-unpacked/resources/MODIFICATIONS.md

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-workbench-linux-x64
          path: |
            apps/desktop/release/*.deb
            apps/desktop/release/*.AppImage
            apps/desktop/release/*-linux.yml
          if-no-files-found: error
          retention-days: 30

  release-draft:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/agent-workbench-v')
    needs: [verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-workbench-linux-x64
          path: release

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --draft --generate-notes --title "Agent Workbench ${{ github.ref_name }}"
